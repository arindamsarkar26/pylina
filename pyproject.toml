version = "0.1.0"
description = "A pure-Python Linear Algebra library"
readme = "README.md"
authors = [
    { name = "Arindam Sarkar", email = "arindamsarkarit2012@gmail.com" }
]
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "numpy>=2.4.6",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]
